<!-- Hamburger button, mobile only -->
<button
  (click)="toggle()"
  class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-slate-900 text-white rounded"
  aria-label="Toggle menu"
>
  ☰
</button>

<!-- Overlay when sidebar is open on mobile -->
@if (isOpen()) {
  <div class="fixed inset-0 bg-black/50 z-30 lg:hidden" (click)="close()"></div>
}

<nav
  [class.-translate-x-full]="!isOpen()"
  [class.translate-x-0]="isOpen()"
  class="fixed top-0 left-0 z-40 flex flex-col gap-4 w-64 p-6 bg-slate-900 text-slate-100 border-r border-slate-800 transform transition-transform duration-200 lg:sticky lg:top-0 lg:h-screen lg:self-start lg:translate-x-0"
>
  @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="text-yellow-400 font-medium"
      (click)="close()"
      class="transition-colors duration-200 hover:text-yellow-400"
    >
      {{ item.label }}
    </a>
  }
</nav>
